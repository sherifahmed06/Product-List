            <div class="col-md-4">
                <div class="cart p-4">
                    <h4 class="fw-bold your-cart">Your Cart (0)</h4>
                    <div class="card-empty-img m-auto text-center">
                        <img src="images/illustration-empty-cart.svg" class="w-50 py-4" alt="">
                        <p class="text-muted">Your added items will appear here</p>
                    </div>
                    <div class="card-items  d-none">
                        <div class="items mb-3 d-flex justify-content-between align-items-center">
                            <div class="left-side">
                                <p class="mt-4 mb-1 fw-bold">Classic Tiramisu</p>
                                <span class="item-count me-3 fw-bold">1x</span>
                                <span class="item-price my-0 me-2 text-muted">@ $5.50</span>

                            <div class="right-side">
                                <div class="delete-item">
                                    <i class="fa-regular fa-circle-xmark"></i>
                                </div>
                            </div>
                        </div>
                        <div class="order-conclusion mt-4 d-flex justify-content-between align-items-center">
                            <div class="order-total">
                                <p>Order Total</p>
                            </div>
                            <div class="order-price">
                                <h4 class="fw-bold">$45.60</h4>
                            </div>

                        </div>
                        <div class="order-confirmation mt-2">
                            <button class="py-3 w-100">Confirm Order</button>
